---
# ============================================================
# T-Pot Community Edition 24.04 Install Playbook
# ============================================================
# Deploys T-Pot HIVE flavor (full sensor set) on Ubuntu 24.04 EC2.
#
# Preconditions:
#   - EC2 running Ubuntu 24.04 LTS, reachable at inventory 'honeypot'
#   - Ansible controller has SSH key at ~/.ssh/cp2_honeypot_ed25519
#   - Root disk resized to 128GB (Terraform-managed)
#   - vars/tpot_secrets.yml populated with tpot_web_user + tpot_web_pass
#
# Post-install state:
#   - SSH management moved to port 64295 (from 22)
#   - Port 22 becomes Cowrie SSH honeypot
#   - Kibana admin dashboard at https://<public_ip>:64297
#   - Instance reboots at end of installer
# ============================================================

- name: Install T-Pot Community Edition on Ubuntu 24.04 EC2
  hosts: honeypot
  become: true
  gather_facts: true

  vars_files:
    - vars/tpot_secrets.yml

  vars:
    tpot_repo: "https://github.com/telekom-security/tpotce.git"
    tpot_dir: "/home/ubuntu/tpotce"   # ubuntu-owned dir; T-Pot install.sh refuses root
    tpot_flavor: "HIVE"

  tasks:

    # ------------------------------------------------------------
    # STAGE 1: Extend filesystem to use the resized 128GB EBS volume
    # ------------------------------------------------------------
    - name: Install cloud-guest-utils (provides growpart command)
      ansible.builtin.apt:
        name: cloud-guest-utils
        state: present
        update_cache: yes

    - name: Extend root partition to fill the 128GB EBS volume
      ansible.builtin.shell:
        cmd: growpart /dev/nvme0n1 1
      register: growpart_result
      changed_when: growpart_result.rc == 0
      failed_when: growpart_result.rc not in [0, 1]

    - name: Resize ext4 filesystem to fill the enlarged partition
      ansible.builtin.shell:
        cmd: resize2fs /dev/nvme0n1p1
      register: resize_result
      changed_when: "'Nothing to do' not in resize_result.stdout"

    - name: Verify disk size after resize
      ansible.builtin.command:
        cmd: df -h /
      register: df_after_resize
      changed_when: false

    - name: Display filesystem size after resize (should show ~125G)
      ansible.builtin.debug:
        var: df_after_resize.stdout_lines

    # ------------------------------------------------------------
    # STAGE 2: System preparation
    # ------------------------------------------------------------
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Perform full system upgrade (security patches)
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes

    - name: Install T-Pot prerequisites
      ansible.builtin.apt:
        name:
          - git
          - curl
          - ca-certificates
        state: present

    # ------------------------------------------------------------
    # STAGE 3: Clean up any old install attempts, then clone T-Pot as ubuntu
    # ------------------------------------------------------------
    - name: Remove old /opt/tpotce clone (from previous root-owned attempts)
      ansible.builtin.file:
        path: /opt/tpotce
        state: absent

    - name: Remove old /home/ubuntu/tpotce (for a clean retry)
      ansible.builtin.file:
        path: "{{ tpot_dir }}"
        state: absent

    - name: Clone T-Pot repository to /home/ubuntu/tpotce as ubuntu
      ansible.builtin.git:
        repo: "{{ tpot_repo }}"
        dest: "{{ tpot_dir }}"
        version: master
        force: yes
      become: false   # clone as ubuntu, not root, so install.sh can run without permission issues

    # ------------------------------------------------------------
    # STAGE 4: Run T-Pot installer as ubuntu user with argv (avoids shell interpretation)
    # ------------------------------------------------------------
    - name: Run T-Pot installer AS THE UBUNTU USER (~15–30 minutes)
      ansible.builtin.command:
        argv:
          - ./install.sh
          - -s
          - -t
          - h
          - -u
          - "{{ tpot_web_user }}"
          - -p
          - "{{ tpot_web_pass }}"
        chdir: "{{ tpot_dir }}"
      become: false       # override play-level become; T-Pot install.sh forbids root
      environment:
        DEBIAN_FRONTEND: noninteractive
      async: 2700
      poll: 60
      register: install_result
      no_log: true        # protect password from Ansible logs
      failed_when: false

    - name: Show installer return code (rc) for diagnostics
      ansible.builtin.debug:
        msg:
          - "Installer finished. Return code (rc): {{ install_result.rc | default('unknown') }}"
          - "If rc != 0, SSH in and inspect: /home/ubuntu/tpotce/install.log or journalctl -xe"

    # ------------------------------------------------------------
    # STAGE 5: Post-install guidance
    # ------------------------------------------------------------
    - name: Post-install guidance
      ansible.builtin.debug:
        msg:
          - "===== T-Pot install phase complete ====="
          - "The T-Pot installer typically reboots the instance to finalize."
          - "Ansible controller will lose connection during reboot."
          - ""
          - "POST-REBOOT ACTIONS:"
          - "1. Wait ~5 minutes for the EC2 to come back online."
          - "2. Update infra/ansible/inventory.yml — change ansible_port from 22 to 64295."
          - "3. Verify with: ansible honeypot -m ping"
          - "4. Open Kibana at https://<PUBLIC_IP>:64297 (browser will warn about self-signed cert — accept)."
          - "5. Login with the credentials in vars/tpot_secrets.yml."