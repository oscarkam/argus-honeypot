# tpot_web_user: username for the T-Pot Kibana admin dashboard (webUI login)
# tpot_web_pass: strong password (16+ chars, mix of upper/lower/digit/symbol)

tpot_web_user: "REPLACE_ME_USERNAME"
tpot_web_pass: "REPLACE_ME_WITH_STRONG_16_CHAR_PASSWORD"