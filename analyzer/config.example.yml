# ============================================================
# ARGUS Configuration
# ============================================================
# Copy this file to config.yml and fill in real values.
# config.yml is gitignored — never commit real credentials.

# ---- System identity — used for report branding ----
system:
  name: "ARGUS"
  tagline: "AI-Assisted Threat Intelligence Platform"
  version: "0.1"

# ---- Report generation ----
report:
  organization: "REPLACE_WITH_YOUR_ORG_OR_NAME"
  output_dir: "../reports"
  timezone: "Asia/Kuala_Lumpur"

# ---- Elasticsearch (T-Pot data source) ----
elasticsearch:
  hosts:
    - "http://localhost:9200"
  username: "elastic"
  password: "CHANGE_ME_ES_PASSWORD"
  verify_certs: false

# ---- Ollama (local LLM for narrative) ----
ollama:
  base_url: "http://localhost:11434"
  model: "llama3.2:3b"
  timeout: 300
  temperature: 0.3    # 0 = fully deterministic; higher = more variation (0.3 = subtle variety)

tpot:
  host: "3.1.46.106"     # Elastic IP — permanent
  ports:
    kibana: 64297        # Kibana dashboard + Attack Map (nginx auth)
    cockpit: 64294       # System management UI
    ssh: 64295           # Management SSH